<main class="auth-page"><div class="auth-shell"><div class="auth-brandline"><svg class="auth-flame" viewBox="0 0 64 80" aria-hidden="true"><defs><linearGradient id="flameGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7660ff"/><stop offset="1" stop-color="#393cff"/></linearGradient></defs><path fill="url(#flameGradient)" d="M35 2C39 17 20 23 19 37c-1 7 2 12 6 15-1-10 7-14 12-20 0 10 12 14 9 28 7-5 13-14 12-24-1-9-8-15-13-20 1 9-3 12-7 13C42 17 42 9 35 2ZM23 38C8 48 7 60 16 70c5 6 12 8 18 8-7-8-8-14-5-21-6-4-8-10-6-19Z"/></svg><span>Hell <b>Host</b></span></div><p class="auth-tagline">Fast <i>•</i> Reliable <i>•</i> Affordable</p><section class="auth-card"><h1>Create Account</h1><p class="muted">Create your Hell Host account</p>
