<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — Hell Host</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav-wrap"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>Hell<span>Host</span></span></a></nav></header>
<main class="auth-page"><section class="auth-card"><div class="eyebrow">JOIN HELL HOST</div><h1>Create <span>Account</span></h1><p class="muted">Create your account and start your first month free.</p>
<form onsubmit="signup(event)">
<label>Email<input id="signup-email" type="email" placeholder="you@example.com" required></label>
<label>Password<input id="signup-password" type="password" minlength="6" placeholder="At least 6 characters" required></label>
<label>Confirm Password<input id="signup-confirm" type="password" minlength="6" placeholder="Repeat your password" required></label>
<button class="btn primary full" type="submit">Create Account →</button>
</form><p class="signup">Already have an account? <a href="login.html">Login</a></p><p id="signup-message"></p></section></main><script src="script.js"></script></body></html>
