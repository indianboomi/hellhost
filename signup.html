<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — Hell Host</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="hellhost-logo.svg"></head>
<body class="auth-design signup-page"><header class="nav-wrap"><nav class="nav container"><a class="brand" href="index.html"><img class="brand-logo" src="hellhost-logo.svg" alt="Hell Host logo"><span>Hell<span>Host</span></span></a></nav></header>
<main class="auth-page"><div class="auth-shell"><div class="auth-brandline"><img class="auth-brand-logo" src="hellhost-logo-blue.svg" alt="Hell Host logo"><span>Hell <b>Host</b></span></div><p class="auth-tagline">Fast <i>•</i> Reliable <i>•</i> Affordable</p><section class="auth-card"><h1>Create Account</h1><p class="muted">Create your account</p>
<form onsubmit="signup(event)">
<label class="auth-input-wrap"><span class="field-icon">✉</span><input id="signup-email" type="email" placeholder="Email address" required></label>
<label class="auth-input-wrap"><span class="field-icon">♙</span><input id="signup-password" type="password" minlength="6" placeholder="Password (at least 6 characters)" required></label>
<label class="auth-input-wrap"><span class="field-icon">♙</span><input id="signup-confirm" type="password" minlength="6" placeholder="Confirm password" required></label>
<button class="btn primary full auth-submit" type="submit">Create Account <span>→</span></button>
</form><p class="signup">Already have an account? <a href="login.html">Login</a></p><p id="signup-message"></p></section></div></main><script src="script.js"></script><script type="module" src="firebase-auth.js"></script></body></html>
