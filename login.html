<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — Hell Host</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="hellhost-logo.svg"></head>
<body class="auth-design login-page">
<header class="nav-wrap"><nav class="nav container"><a class="brand" href="index.html"><img class="brand-logo" src="hellhost-logo.svg" alt="Hell Host logo"><span>Hell<span>Host</span></span></a></nav></header>
<main class="auth-page"><section class="auth-card">
<div class="auth-brandline"><span class="auth-flame">ϟ</span><span>Hell <b>Host</b></span></div><p class="auth-tagline">Fast <i>•</i> Reliable <i>•</i> Affordable</p><h1>Welcome Back</h1><p class="muted">Login to your Hell Host account</p>
<form onsubmit="login(event)">
<label class="auth-input-wrap"><span class="field-icon">✉</span><input id="email" type="email" placeholder="Email address" required></label>
<label class="auth-input-wrap"><span class="field-icon">♙</span><input id="password" type="password" placeholder="Password" required></label>
<button class="btn primary full auth-submit" type="submit">Login <span>→</span></button>
</form>
<div class="divider"><span>OR</span></div>
<div class="oauth-buttons">
<button class="oauth-btn google" type="button" onclick="startOAuth('Google')"><img class="oauth-logo-img" src="google-logo.svg" alt="Google">Continue with Google</button>
<button class="oauth-btn github" type="button" onclick="startOAuth('GitHub')"><img class="oauth-logo-img" src="github-logo.svg" alt="GitHub">Continue with GitHub</button>
<button class="oauth-btn discord" type="button" onclick="startOAuth('Discord')"><img class="oauth-logo-img" src="https://cdn.simpleicons.org/discord/5865F2" alt="Discord">Continue with Discord</button>
</div>
<p class="signup">Don't have an account? <a href="signup.html">Create New Account</a></p>
<p id="login-message"></p>
</section></main><script src="script.js"></script></body></html>
